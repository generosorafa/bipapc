<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BipaPC</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #09090b;
    --surface: #18181b;
    --surface-2: #121214;
    --border: #27272a;
    --border-strong: #3f3f46;
    --text: #fafafa;
    --text-muted: #a1a1aa;
    --text-faint: #71717a;
    --primary: #fafafa;
    --primary-text: #09090b;
    --danger: #ef4444;
    --danger-border: #7f1d1d;
    --success: #22c55e;
    --amber: #f59e0b;
    --radius: 0.75rem;
    --radius-sm: 0.5rem;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 24px);
  }
  .lucide { width: 18px; height: 18px; stroke-width: 1.75; flex-shrink: 0; }

  header.topbar {
    position: sticky; top: 0; z-index: 10;
    display: flex; align-items: center; justify-content: space-between;
    padding: calc(env(safe-area-inset-top, 0px) + 14px) 18px 14px;
    background: rgba(9,9,11,0.9);
    backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--border);
  }
  .brand { display: flex; align-items: center; gap: 9px; }
  .brand .lucide { width: 20px; height: 20px; color: var(--text); }
  .brand span { font-weight: 600; font-size: 1.05rem; letter-spacing: -0.01em; }

  .topbar-right { display: flex; align-items: center; gap: 10px; }
  .conn-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--text-faint); }
  .conn-dot.on { background: var(--success); box-shadow: 0 0 0 3px rgba(34,197,94,0.15); }

  .icon-btn {
    display: flex; align-items: center; justify-content: center;
    width: 36px; height: 36px; border-radius: var(--radius-sm);
    background: transparent; border: 1px solid transparent; cursor: pointer;
    color: var(--text-muted);
  }
  .icon-btn:hover { background: var(--surface); border-color: var(--border); color: var(--text); }

  main { padding: 18px; display: flex; flex-direction: column; gap: 16px; max-width: 480px; margin: 0 auto; }

  .card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 16px;
  }
  .card-header { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
  .card-header .lucide { color: var(--text-muted); width: 16px; height: 16px; }
  .card-header h2 { font-size: 0.8rem; font-weight: 600; margin: 0; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.04em; }

  .panel { display: none; }
  .panel.open { display: block; }
  .panel-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
  .panel-header h2 { font-size: 0.95rem; font-weight: 600; margin: 0; }

  .field { margin-bottom: 12px; }
  .field label {
    display: block; font-size: 0.78rem; color: var(--text-muted);
    margin-bottom: 6px; font-weight: 500;
  }
  .field input {
    width: 100%; height: 2.6rem; padding: 0 12px;
    background: var(--surface-2); border: 1px solid var(--border);
    border-radius: var(--radius-sm); color: var(--text); font-size: 0.92rem;
    outline: none; transition: border-color .15s;
  }
  .field input::placeholder { color: var(--text-faint); }
  .field input:focus { border-color: var(--border-strong); }

  .btn {
    display: flex; align-items: center; justify-content: center; gap: 8px;
    width: 100%; height: 2.75rem; border-radius: var(--radius-sm);
    font-size: 0.92rem; font-weight: 600; cursor: pointer; border: 1px solid transparent;
    transition: opacity .15s, background-color .15s;
  }
  .btn .lucide { width: 16px; height: 16px; }
  .btn-primary { background: var(--primary); color: var(--primary-text); }
  .btn-primary:hover { opacity: 0.88; }
  .btn-outline { background: transparent; color: var(--text); border-color: var(--border-strong); }
  .btn-outline:hover { background: var(--surface-2); }
  .btn[hidden] { display: none; }

  .reader { width: 100%; border-radius: var(--radius-sm); overflow: hidden; margin-bottom: 12px; background: #000; min-height: 220px; }

  .status-badge {
    display: flex; align-items: center; gap: 8px;
    padding: 9px 12px; border-radius: var(--radius-sm);
    background: var(--surface-2); border: 1px solid var(--border);
    font-size: 0.85rem; color: var(--text-muted); margin-bottom: 12px;
  }
  .status-badge .lucide { width: 15px; height: 15px; }
  .status-badge[data-state="scanning"] { color: var(--amber); border-color: rgba(245,158,11,0.3); }
  .status-badge[data-state="success"] { color: var(--success); border-color: rgba(34,197,94,0.3); }
  .status-badge[data-state="error"] { color: var(--danger); border-color: rgba(239,68,68,0.3); }
  .status-badge .st-icon { display: none; }
  .status-badge[data-state="idle"] .st-icon.st-idle,
  .status-badge[data-state="scanning"] .st-icon.st-scanning,
  .status-badge[data-state="success"] .st-icon.st-success,
  .status-badge[data-state="error"] .st-icon.st-error { display: block; }
  .spin { animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .log-list { list-style: none; margin: 0; padding: 0; }
  .log-item {
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    padding: 10px 0; border-bottom: 1px solid var(--border);
  }
  .log-item:last-child { border-bottom: none; }
  .log-item .code {
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 0.85rem; color: var(--text); overflow-wrap: anywhere;
  }
  .log-item .time { font-size: 0.75rem; color: var(--text-faint); white-space: nowrap; }
  .log-empty { padding: 14px 0; text-align: center; color: var(--text-faint); font-size: 0.85rem; }
</style>
</head>
<body>

<header class="topbar">
  <div class="brand">
    <svg class="lucide" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7V5a2 2 0 0 1 2-2h2"/><path d="M17 3h2a2 2 0 0 1 2 2v2"/><path d="M21 17v2a2 2 0 0 1-2 2h-2"/><path d="M7 21H5a2 2 0 0 1-2-2v-2"/><line x1="7" y1="12" x2="17" y2="12"/></svg>
    <span>BipaPC</span>
  </div>
  <div class="topbar-right">
    <span class="conn-dot" id="connDot"></span>
    <button class="icon-btn" id="settingsBtn" aria-label="Configurações">
      <i data-lucide="settings-2"></i>
    </button>
  </div>
</header>

<main>

  <section class="card panel" id="configPanel">
    <div class="panel-header">
      <h2>Conexão</h2>
      <button class="icon-btn" id="closeConfigBtn" aria-label="Fechar"><i data-lucide="x"></i></button>
    </div>
    <div class="field">
      <label for="dbUrl">URL do Realtime Database</label>
      <input id="dbUrl" placeholder="https://seu-projeto-default-rtdb.firebaseio.com">
    </div>
    <div class="field">
      <label for="roomId">Código da sala</label>
      <input id="roomId" placeholder="rm-ab12cd">
    </div>
    <button class="btn btn-primary" id="saveBtn"><i data-lucide="check"></i> Salvar conexão</button>
  </section>

  <section class="card">
    <div id="reader" class="reader"></div>

    <div class="status-badge" id="statusBadge" data-state="idle">
      <svg class="lucide st-icon st-idle" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10" stroke-dasharray="3 3"/></svg>
      <svg class="lucide st-icon st-scanning spin" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-6.219-8.56"/></svg>
      <svg class="lucide st-icon st-success" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
      <svg class="lucide st-icon st-error" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
      <span id="statusText">Pronto para iniciar</span>
    </div>

    <button class="btn btn-primary" id="startBtn"><i data-lucide="camera"></i> Iniciar leitura</button>
    <button class="btn btn-outline" id="stopBtn" hidden><i data-lucide="square"></i> Parar leitura</button>
  </section>

  <section class="card">
    <div class="card-header">
      <i data-lucide="history"></i>
      <h2>Últimos códigos</h2>
    </div>
    <ul class="log-list" id="log">
      <li class="log-empty" id="logEmpty">Nenhum código lido ainda</li>
    </ul>
  </section>

</main>

<script src="https://unpkg.com/lucide@1.0.1"></script>
<script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script>
lucide.createIcons();

const $ = (id) => document.getElementById(id);
const dbUrlInput = $('dbUrl');
const roomIdInput = $('roomId');
const statusBadge = $('statusBadge');
const statusText = $('statusText');
const logEl = $('log');
const logEmpty = $('logEmpty');
const configPanel = $('configPanel');
const connDot = $('connDot');

function isConfigured() {
  return !!(localStorage.getItem('dbUrl') && localStorage.getItem('roomId'));
}

function refreshConnIndicator() {
  connDot.classList.toggle('on', isConfigured());
}

function setStatus(state, text) {
  statusBadge.dataset.state = state;
  statusText.textContent = text;
}

dbUrlInput.value = localStorage.getItem('dbUrl') || '';
roomIdInput.value = localStorage.getItem('roomId') || '';
refreshConnIndicator();
if (!isConfigured()) configPanel.classList.add('open');

$('settingsBtn').onclick = () => configPanel.classList.toggle('open');
$('closeConfigBtn').onclick = () => configPanel.classList.remove('open');

$('saveBtn').onclick = () => {
  localStorage.setItem('dbUrl', dbUrlInput.value.trim().replace(/\/$/, ''));
  localStorage.setItem('roomId', roomIdInput.value.trim());
  refreshConnIndicator();
  if (isConfigured()) configPanel.classList.remove('open');
};

let html5QrCode;
let lastCode = null;
let lastCodeAt = 0;

function addLogEntry(code, when) {
  if (logEmpty) logEmpty.remove();
  const li = document.createElement('li');
  li.className = 'log-item';
  const codeSpan = document.createElement('span');
  codeSpan.className = 'code';
  codeSpan.textContent = code;
  const timeSpan = document.createElement('span');
  timeSpan.className = 'time';
  timeSpan.textContent = when.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
  li.append(codeSpan, timeSpan);
  logEl.prepend(li);
  while (logEl.children.length > 8) logEl.removeChild(logEl.lastChild);
}

async function onScanSuccess(decodedText) {
  const now = Date.now();
  if (decodedText === lastCode && now - lastCodeAt < 2500) return;
  lastCode = decodedText;
  lastCodeAt = now;

  if (!isConfigured()) {
    setStatus('error', 'Configure a conexão primeiro');
    configPanel.classList.add('open');
    return;
  }

  const dbUrl = localStorage.getItem('dbUrl');
  const roomId = localStorage.getItem('roomId');

  setStatus('scanning', 'Enviando ' + decodedText + '…');
  try {
    await fetch(`${dbUrl}/rooms/${encodeURIComponent(roomId)}/lastScan.json`, {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ code: decodedText, ts: now })
    });
    setStatus('success', 'Enviado: ' + decodedText);
    addLogEntry(decodedText, new Date(now));
  } catch (err) {
    setStatus('error', 'Erro ao enviar código');
  }
}

$('startBtn').onclick = async () => {
  html5QrCode = new Html5Qrcode('reader');
  try {
    await html5QrCode.start(
      { facingMode: 'environment' },
      { fps: 10, qrbox: { width: 260, height: 180 } },
      onScanSuccess
    );
    $('startBtn').hidden = true;
    $('stopBtn').hidden = false;
    setStatus('scanning', 'Aponte a câmera para o código');
  } catch (err) {
    setStatus('error', 'Câmera indisponível');
  }
};

$('stopBtn').onclick = async () => {
  if (html5QrCode) {
    await html5QrCode.stop();
    html5QrCode.clear();
  }
  $('startBtn').hidden = false;
  $('stopBtn').hidden = true;
  setStatus('idle', 'Pronto para iniciar');
};
</script>
</body>
</html>
